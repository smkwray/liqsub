source_id: dts
source_name: Daily Treasury Statement
role: cash_flow_tga_bill_net_issuance_context
status: executable_via_fiscaldata
frequency: daily
raw_storage: data/raw/fiscaldata/
access:
  mode: fiscaldata_api
  source_url: https://api.fiscaldata.treasury.gov/services/api/fiscal_service/v1/accounting/dts/operating_cash_balance
  official_landing_page: https://fiscaldata.treasury.gov/datasets/daily-treasury-statement/operating-cash-balance
endpoints:
  operating_cash_balance: /v1/accounting/dts/operating_cash_balance
  deposits_withdrawals_operating_cash: /v1/accounting/dts/deposits_withdrawals_operating_cash
  public_debt_transactions: /v1/accounting/dts/public_debt_transactions
expected_fields:
  - date
  - tga_balance
  - deposits_with_federal_reserve
  - public_debt_transactions
  - bill_issuance_or_redemptions
monthly_aggregation:
  tga_balance: use last available daily closing balance in calendar month
  flows: sum daily flows over calendar month when flow fields are added
notes:
  - Use to support net issuance and TGA cash-flow controls after monthly MVP.
  - DTS values are reported in millions of dollars.
