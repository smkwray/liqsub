source_id: tgarefill
source_name: tgarefill weekly upstream exports
role: weekly_tga_rebuild_event_and_plumbing_scaffold
status: local_export_available
frequency: weekly
raw_storage: data/raw/tgarefill/
access:
  mode: local_copy_from_tgarefill_exports
  upstream_project: tgarefill
  upstream_exports:
    master_weekly_panel: outputs/tables/master_weekly_panel.csv
    event_candidates: outputs/tables/event_candidates.csv
    auction_shock_lp: outputs/tables/auction_shock_lp.csv
    canonical_bill_surprise_shocks: outputs/tables/canonical_bill_surprise_shocks.csv
    promotion_robustness_summary: outputs/tables/promotion_robustness_summary.csv
    promotion_memo: outputs/tgarefill_promotion_memo.md
  local_imports:
    master_weekly_panel: data/raw/tgarefill/master_weekly_panel.csv
    event_candidates: data/raw/tgarefill/event_candidates.csv
    auction_shock_lp: data/raw/tgarefill/auction_shock_lp.csv
    canonical_bill_surprise_shocks: data/raw/tgarefill/canonical_bill_surprise_shocks.csv
    promotion_robustness_summary: data/raw/tgarefill/promotion_robustness_summary.csv
    promotion_memo: data/raw/tgarefill/tgarefill_promotion_memo.md
expected_fields:
  - date
  - tga_weekly_average
  - reserve_balances_weekly_wednesday
  - reverse_repos_weekly_wednesday
  - commercial_bank_deposits_weekly_sa
  - bill
  - coupon
  - bill_share
  - event_id
  - baseline_date
  - start_date
  - end_date
  - bill_size_surprise
  - bill_size_surprise_announcement_week
  - h4_effect_bn
  - h4_t_stat_nw
monthly_aggregation:
  weekly_exports: not aggregated; consumed at native weekly grain
notes:
  - This project treats tgarefill as an upstream local export boundary and validates copied files before weekly builds.
  - The frozen source snapshot should preserve the copied local files and their hashes.
  - The promotion exports are claim-governance artifacts: broad substitution remains blocked, while focused TGA-refill bill-surprise results are aggregate association evidence only.
